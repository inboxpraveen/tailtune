name: Bug report
description: Something tailtune did wrong, including a memory estimate far from reality.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The exact command
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `tailtune doctor --json`
      description: It contains no secrets and makes no network calls.
      render: json
    validations:
      required: true
  - type: textarea
    id: measured
    attributes:
      label: Measured memory, if this is about an estimate
      description: Peak GPU memory you observed, how you measured it, and the training settings.
